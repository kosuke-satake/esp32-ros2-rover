; PlatformIO project for the ESP32 body.
;
; Hardware-independent logic lives in lib/ and is unit-tested on the host
; with the "native" environment. The ESP32 environment is added once the
; board is chosen.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
