name: firmware

# Runs on every pull request, not only firmware changes, so that the job can
# be a required status check for main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run host unit tests
        working-directory: software/firmware
        run: pio test -e native
